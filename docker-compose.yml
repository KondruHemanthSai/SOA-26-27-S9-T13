  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: student-central-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    networks:
      - student-central-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: student-central-frontend
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - student-central-net
    restart: unless-stopped

networks:
  student-central-net:
    driver: bridge
