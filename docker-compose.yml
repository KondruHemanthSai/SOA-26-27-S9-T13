    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    networks:
      - student-central-net
    restart: unless-stopped

  course-service:
