services:
  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    container_name: student-central-eureka
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: "-Xmx384m -Xms128m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks:
      - student-central-net
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    container_name: student-central-auth
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    networks:
      - student-central-net
    restart: unless-stopped

  student-service:
    build:
      context: .
      dockerfile: ./student-service/Dockerfile
    container_name: student-central-student
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
