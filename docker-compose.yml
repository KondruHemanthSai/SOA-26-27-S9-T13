      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JAVA_OPTS: "-Xmx384m -Xms128m"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
