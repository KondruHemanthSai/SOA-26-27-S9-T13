server:
  port: 8088

spring:
  application:
    name: ai-service
  data:
    mongodb:
      uri: ${MONGODB_AI_URI:${MONGODB_URI:${MONGODB_BASE_URI:mongodb://localhost:27017}/student_central_ai${MONGODB_URI_OPTIONS:}}}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:studentCentralSuperSecretJwtKeyWithSufficientLengthForHS256Security2024!}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
  rate-limit:
    requests-per-hour: ${AI_RATE_LIMIT_PER_HOUR:20}
