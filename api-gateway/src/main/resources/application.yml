server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        # Student Service
        - id: student-service
          uri: lb://student-service
          predicates:
            - Path=/api/students/**

        # Admission Service
        - id: admission-service
          uri: lb://admission-service
          predicates:
            - Path=/api/admissions/**

        # Course Service
        - id: course-service
          uri: lb://course-service
          predicates:
            - Path=/api/courses/**

        # Registration Service
        - id: registration-service
          uri: lb://registration-service
          predicates:
            - Path=/api/registrations/**

        # Schedule Service
        - id: schedule-service
          uri: lb://schedule-service
          predicates:
            - Path=/api/schedules/**

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        # AI Service
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/ai/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true

jwt:
  secret: ${JWT_SECRET:studentCentralSuperSecretJwtKeyWithSufficientLengthForHS256Security2024!}

logging:
  level:
    org.springframework.cloud.gateway: INFO

