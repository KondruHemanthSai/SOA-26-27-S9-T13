server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/student_central_auth}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:studentCentralSuperSecretJwtKeyWithSufficientLengthForHS256Security2024!}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  admin:
    bootstrap:
      enabled: ${ADMIN_BOOTSTRAP_ENABLED:true}
      email: ${ADMIN_BOOTSTRAP_EMAIL:admin@studentcentral.com}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:Admin@12345}
      name: ${ADMIN_BOOTSTRAP_NAME:System Administrator}

logging:
  level:
    com.studentcentral.auth: INFO
    org.springframework.data.mongodb: INFO

