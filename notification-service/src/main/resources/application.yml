server:
  port: 8087

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: ${MONGODB_NOTIFICATION_URI:${MONGODB_URI:${MONGODB_BASE_URI:mongodb://localhost:27017}/student_central_notification${MONGODB_URI_OPTIONS:}}}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:studentCentralSuperSecretJwtKeyWithSufficientLengthForHS256Security2024!}

notification:
  default-page-size: 20
  max-page-size: 100

logging:
  level:
    com.studentcentral.notification: INFO
    org.springframework.data.mongodb: INFO
