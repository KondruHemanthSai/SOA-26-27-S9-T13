server:
  port: 8083

spring:
  application:
    name: admission-service
  data:
    mongodb:
      uri: ${MONGODB_ADMISSION_URI:${MONGODB_URI:${MONGODB_BASE_URI:mongodb://localhost:27017}/student_central_admission${MONGODB_URI_OPTIONS:}}}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:studentCentralSuperSecretJwtKeyWithSufficientLengthForHS256Security2024!}

logging:
  level:
    com.studentcentral.admission: INFO
    org.springframework.data.mongodb: INFO

